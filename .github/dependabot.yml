version: 2
updates:
  # Keep the site dependencies and package-lock.json up to date.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Berlin"

    # Keep the number of concurrent dependency updates manageable.
    open-pull-requests-limit: 5

    # Give new releases a short observation period before adopting them.
    cooldown:
      default-days: 5

    labels:
      - "dependencies"
      - "javascript"

    ignore:
      - dependency-name: "remark-gfm"
        # Keep this on 3.0.1 until next-mdx-remote supports remark-gfm 4.
        # See https://github.com/hashicorp/next-mdx-remote/issues/403.
        versions: [">=4.0.0"]
      - dependency-name: "remark-unwrap-images"
        # Version 5 is a deprecated placeholder with no implementation.
        versions: [">=5.0.0"]
      - dependency-name: "react"
        # React 19 should be adopted together with the corresponding Next.js
        # and react-dom upgrades.
        versions: [">=19.0.0"]
      - dependency-name: "react-dom"
        versions: [">=19.0.0"]

    groups:
      markdown-processing:
        patterns:
          - "remark-*"
          - "rehype-*"
          - "react-markdown"
          - "unified"
      eslint:
        patterns:
          - "*eslint*"
      # Catch unmatched non-breaking updates after the specific groups above.
      frontend-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Keep actions used by the repository's workflows up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Berlin"

    labels:
      - "dependencies"

    groups:
      github-actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
